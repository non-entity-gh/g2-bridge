name: Release

# Pushing a tag such as v0.1.0 builds the Windows app and attaches the zip to a
# GitHub release for that tag. The tag must match goggles_bridge.__version__.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: python -m unittest discover -s tests
      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import goggles_bridge; print(goggles_bridge.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} but __version__ is $version"; exit 1; }
      - run: python packaging/build_windows.py
      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $exe = "dist\G2 Bridge\G2 Bridge.exe"
          if (-not (Test-Path $exe)) { throw "exe missing" }
          if (-not (Test-Path "dist\G2 Bridge\ffmpeg\ffmpeg.exe")) { throw "ffmpeg missing" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "The app exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: G2-Bridge-windows
          path: dist/*.zip
      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls dist/*.zip)
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          notes="Windows app: download the zip, extract it, and start **G2 Bridge.exe**. Needs the DJI USB driver from DJI Assistant 2 and an NVIDIA GPU. See README.txt inside.

          SHA-256: \`$sha\`

          Includes FFmpeg 9.0.2 (GPL, Gyan Doshi essentials build, source at https://github.com/GyanD/codexffmpeg)."
          gh release create "${GITHUB_REF_NAME}" "$zip" --title "G2 Bridge ${GITHUB_REF_NAME#v}" --notes "$notes" --verify-tag \
            || gh release upload "${GITHUB_REF_NAME}" "$zip" --clobber
